<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — Duemet</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f1ea;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2d2d; }
    main { text-align: center; padding: 24px; max-width: 360px; }
    img { width: 96px; height: 96px; border-radius: 20px; }
    h1 { font-size: 1.3rem; margin: 16px 0 8px; }
    p { color: #55615f; line-height: 1.5; }
    button { margin-top: 12px; padding: 10px 20px; border: 0; border-radius: 8px; background: #1a8a8a;
             color: #fff; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Duemet needs an internet connection to load bookings. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
